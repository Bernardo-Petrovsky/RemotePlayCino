name: Windows portable build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      request_signing:
        description: Request SignPath signing (only after Foundation acceptance and setup)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.100
      - name: Build and verify a clean portable
        id: build
        shell: pwsh
        run: |
          ./tools/Build-CI.ps1
          $info = (Get-Item -LiteralPath build/ci/publication/RemotePlayCino.exe).VersionInfo
          "version=$($info.ProductVersion)" >> $env:GITHUB_OUTPUT
          "file-version=$($info.FileVersion)" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned EXE and SHA-256
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RemotePlayCino-unsigned
          path: build/ci/publication/*
          if-no-files-found: error
          retention-days: 7
      - name: Check signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing
        shell: pwsh
        env:
          SIGNPATH_READY: ${{ vars.SIGNPATH_READY }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:SIGNPATH_READY -ne 'true') {
            throw 'Signing is available only on main after Foundation acceptance and setup.'
          }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID','SIGNPATH_PROJECT_SLUG','SIGNPATH_SIGNING_POLICY_SLUG','SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
      - name: Submit to SignPath and wait for manual approval
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 900
          output-artifact-directory: build/ci/signed
          parameters: |
            version: ${{ toJSON(steps.build.outputs.version) }}
            file-version: ${{ toJSON(steps.build.outputs.file-version) }}
      - name: Verify the signature and regenerate SHA-256
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing
        shell: pwsh
        run: ./tools/Verify-Signed.ps1 -Directory build/ci/signed
      - name: Upload verified signed EXE and SHA-256
        if: github.event_name == 'workflow_dispatch' && inputs.request_signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: RemotePlayCino-signed
          path: |
            build/ci/signed/RemotePlayCino.exe
            build/ci/signed/RemotePlayCino.exe.sha256
          if-no-files-found: error
          retention-days: 7
